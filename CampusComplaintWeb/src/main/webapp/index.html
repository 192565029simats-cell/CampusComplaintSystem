
<!DOCTYPE html>
<html>
<head>
    <title>Digital Campus Complaint System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #163b72, #4389c9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #163b72;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #163b72;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #245b9d;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .register a {
            color: #245b9d;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h2>Campus Complaint System</h2>

        <p class="subtitle">
            Digital Campus Complaint Tracking and Resolution
        </p>

        
<form action="login" method="post">

    <h2>Student Login</h2>

    <input
        type="text"
        name="loginId"
        placeholder="Register Number or Email"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Enter Password"
        required
    >

    <button type="submit">Login</button>

    <p>
        New student?
        <a href="register.html">Register Here</a>
    </p>

</form>

        <div class="register">
            New student?
            <a href="register.html">Create Account</a>
        </div>

    </div>

</body>
</html>
